[build-system]
# setuptools has no stable major semantics (77 to 84 are all "major" releases): the floor is the
# first release that reads `license = "Apache-2.0"` (PEP 639, 77), the ceiling stops before the
# release after the pinned one, so an sdist build cannot pick an untested setuptools. The same
# range is in the `dev` extra; the one named exception of
# `tests/test_packaging.py::TestNoRangeAdmitsAnUntestedMajor`.
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
version = "0.13.0"
# The PyPI distribution is `llm-fsm`: `fsm-llm` on PyPI is another project. Only this name
# (and the `llm-fsm[extra]` self-references of `all`) changed; the import package stays
# `fsm_llm` and the console scripts below stay `fsm-llm*` (plan d454fd62, D-020).
name = "llm-fsm"
description = "Finite State Machines for Large Language Models"
readme = "README.md"
authors = [{name = "Nikolas Markou", email = "nikolasmarkou@gmail.com"}]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "llm", "fsm", "finite state machine",
    "large language model", "conversation",
    "ai workflows", "agentic workflows"
]

# Core dependencies (minimal)
dependencies = [
    "loguru>=0.7.3,<1",
    "litellm>=1.109.0,<2.0",
    "pydantic>=2.0,<3",
    "python-dotenv>=1.0.0,<2",
    # DECISION plan-2026-07-19T075908-70b6bdec/D-002
    # Do NOT remove this as an "unused" dependency: nothing in src/ imports tenacity directly.
    # It is required by litellm's sync retry paths (litellm/main.py, and litellm/utils.py dispatching
    # to completion_with_retries), which open with an unconditional `import tenacity` and raise a
    # BARE Exception on ImportError with no fallback. litellm does not declare it itself (verified via
    # importlib.metadata.requires('litellm') on 1.82.6), so without this line `num_retries` is
    # accepted through **kwargs but silently non-functional. See decisions.md D-002.
    "tenacity>=9.0,<10",
    # fsm_llm.frontmatter (shared by okf and skills) parses YAML frontmatter
    # with a SafeLoader subclass. PyYAML was only installed transitively (litellm
    # -> tokenizers -> huggingface-hub), so it is declared here like tenacity.
    "pyyaml>=6.0,<7",
]

requires-python = ">=3.11"

# Optional extras
[project.optional-dependencies]
workflows = []  # No additional deps; validation uses plain Python DFS
reasoning = []       # No additional deps; included in core install
agents = []          # No additional deps; included in core install
monitor = [
    "fastapi>=0.100.0,<1",
    "uvicorn>=0.20.0,<1",
    "jinja2>=3.1.0,<4",
]
mcp = ["mcp>=2.2,<3"]
otel = [
    "opentelemetry-api>=1.20.0,<2",
    "opentelemetry-sdk>=1.20.0,<2",
]
a2a = ["httpx>=0.24.0,<1"]
# Evaluation tooling (fsm_llm.eval) is stdlib plus core deps only; listed as an
# extra so it appears in the `all` set and in the dev/CI install lists.
eval = []
# Runtime FSM synthesis (fsm_llm.synthesis) is stdlib plus core deps and the agents
# package only; listed as an extra so it appears in `all` and the install lists.
synthesis = []
# Public test doubles and assertions (fsm_llm.testing) are stdlib plus core deps only
# and never import pytest; listed as an extra so it appears in `all` and the install lists.
testing = []
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=7.0,<8",
    # coverage itself (pytest-cov only requires >=7.10.6): pinned in constraints.txt so the
    # branch-coverage ratchet (scripts/coverage_ratchet.py) reads one measurement everywhere.
    "coverage>=7.10.6,<8",
    "pytest-mock>=3.14.0,<4",
    # A hard per-test timeout (the thread method, which Windows needs): a hung test fails with a
    # stack dump instead of running to the CI job limit. Set in [tool.pytest.ini_options]; plan
    # ace7a8c8 D-060.
    "pytest-timeout>=2.4.0,<3",
    "ruff>=0.4.0,<1",
    # The exact version is pinned in constraints.txt, not here — see the pin block there.
    "mypy>=2.0,<3",
    # Layering contracts in `.importlinter` (`make lint-imports`); grimp is its engine.
    "import-linter>=2.1,<3",
    # The wheel-content test builds a wheel with `python -m build --no-isolation`, and
    # `test_packages_find_matches_disk` imports setuptools: both need the backend importable
    # in the test environment. Python 3.12 and later no longer seed it (step 115.1). The exact
    # pin is in constraints.txt, the same one the build backend uses.
    "build>=1.2,<2",
    "setuptools>=77,<85",
    # The CI job `supply-chain` audits the installed environment with it; exact pin in
    # constraints.txt, `.github/workflows/python-package.yml` runs `pip-audit --skip-editable`.
    "pip-audit>=2.9,<3",
    # Two tests (`test_limits.py`, `test_foundation_dedup.py`) check that a real numpy integer is
    # accepted by the tool limit readers; they `importorskip("numpy")`, so without it they skip
    # in CI (plan d454fd62 step 120.2). Exact pin in constraints.txt. numpy 2.4.6 ships wheels
    # for CPython 3.11 to 3.14 only, so the Python 3.15 leg skips them instead of building from source.
    "numpy>=2.0,<3; python_version < '3.15'",
]
all = [
    "llm-fsm[workflows]",
    "llm-fsm[reasoning]",
    "llm-fsm[agents]",
    "llm-fsm[monitor]",
    "llm-fsm[eval]",
    "llm-fsm[synthesis]",
    "llm-fsm[testing]",
    "llm-fsm[mcp]",
    "llm-fsm[otel]",
    "llm-fsm[a2a]",
]

[project.urls]
"Homepage" = "https://github.com/NikolasMarkou/fsm_llm"
"Bug Tracker" = "https://github.com/NikolasMarkou/fsm_llm/issues"

# Core CLI tools (always available)
[project.scripts]
fsm-llm = "fsm_llm.__main__:main_cli"
fsm-llm-visualize = "fsm_llm.core.visualize.cli:main_cli"
fsm-llm-validate = "fsm_llm.core.verify.cli:main_cli"
fsm-llm-monitor = "fsm_llm.monitor.__main__:main_cli"
fsm-llm-meta = "fsm_llm.agents.meta_cli:main_cli"
fsm-llm-eval = "fsm_llm.eval.__main__:run"
fsm-llm-okf = "fsm_llm.okf.cli:main_cli"
fsm-llm-skills = "fsm_llm.skills.cli:main_cli"

# Docs site tooling (roadmap row 0.7; `mkdocs.yml`, `make docs`). A PEP 735 dependency GROUP,
# not an extra, on purpose: mkdocs-material needs Python >= 3.11 and these tools are for
# maintainers and CI, never for a user of the library, so they must not appear in the package
# metadata or in `all`/`dev`. Install with `pip install --group docs -c constraints.txt`
# (pip >= 25.1). Every range is bounded and holds its exact pin in constraints.txt
# (`tests/test_packaging.py::TestDeclaredRangesMatchPins`). `mkdocs<2` is deliberate: mkdocs 2
# drops the plugin system and the YAML config that this site is built on, and Material for MkDocs
# is in maintenance mode (end of life 2027-05-05), so everything here is pinned exactly.
[dependency-groups]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.8.1,<10",
    "mike>=2.2.0,<3",
    "mkdocs-include-markdown-plugin>=7.3.1,<8",
    "pymdown-extensions>=13.1,<14",
]

# The import package `fsm_llm` is the directory `src/fsm_llm/` (src layout):
# `packages.find` finds it and its subpackages by itself; nothing to list when one
# is added. `include` keeps the search to `fsm_llm*` (a stray top-level directory
# under `src/` would otherwise ship).
[tool.setuptools.packages.find]
where = ["src"]
include = ["fsm_llm*"]
namespaces = false

[tool.setuptools]
# The data files are listed by `package-data` below. The default of a pyproject project,
# `include-package-data = true`, also reads MANIFEST.in and then warns that
# `fsm_llm.monitor.static` (a data directory, not a package) is "absent from the packages
# configuration"; a newer setuptools may make that an error (roadmap row 0.1, step 113).
include-package-data = false

[tool.setuptools.package-data]
fsm_llm = ["py.typed"]
"fsm_llm.monitor" = ["static/**/*", "templates/*", "workflows/*.json"]
"fsm_llm.core.definitions" = ["schemas/*.json"]
"fsm_llm.reasoning" = ["strategies/*.json"]
"fsm_llm.agents" = ["patterns/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Built in (no plugin): dump every thread's stack after 240 s inside one test, kill nothing. It fires
# BEFORE the hard 300 s limit below (which ends the process), so a slow test is named while it is
# still running and a hang on a CI leg shows the line instead of ending with no output.
faulthandler_timeout = 240
# A HARD limit (pytest-timeout, in the `dev` extra; plan ace7a8c8 D-060): a test that runs longer than 300 s
# is stopped with a stack dump of every thread. The thread method works on Windows (the signal method
# does not) and ends the whole pytest process, so a hang costs 5 minutes, not the CI job limit.
# `--timeout=0` disables it; `@pytest.mark.timeout(N)` sets one test.
timeout = 300
timeout_method = "thread"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "examples: marks example tests",
    "real_llm: marks tests requiring real LLM API",
]

# Branch coverage of the package, read by `pytest --cov` (and by the ratchet, which only
# gates the canonical leg: Linux, Python 3.12, `mcp`, `otel` and `a2a` installed). `make coverage` and the
# tox coverage env still pass `--cov=fsm_llm --cov-branch` explicitly.
[tool.coverage.run]
branch = true
source = ["fsm_llm"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort (import sorting)
    "UP",    # pyupgrade (Python version upgrades)
    "B",     # flake8-bugbear
    "RUF",   # ruff-specific rules
]
# PLW1514 (unspecified-encoding) is still a preview rule in the pinned ruff
# (D-018). `preview` plus `explicit-preview-rules` selects ONLY the rules named
# in `extend-select`: nothing else in the preview set is switched on by prefix.
# Windows and the C locale do not default to UTF-8, so every text file call names
# its encoding. The AST gate is tests/test_packaging.py::TestExplicitEncodings.
preview = true
explicit-preview-rules = true
extend-select = ["PLW1514"]
ignore = [
    "E402",    # module-level import not at top (from __future__)
    "E501",    # line too long (handled by formatter)
    "RUF013",  # implicit Optional — too many signatures to change safely
    "RUF001",  # ambiguous unicode — intentional in test/prompt data
    "RUF022",  # __all__ not sorted — current order is semantically grouped
    # UP038 was REMOVED from ruff upstream as withdrawn advice: PEP 604 syntax in
    # isinstance/issubclass is not recommended practice and is slightly slower
    # (`ruff rule UP038`). The .venv pins ruff 0.15.22 (constraints.txt), which no
    # longer has the rule, but .pre-commit-config.yaml pins ruff-pre-commit v0.9.10,
    # which still emits it — so `ruff check` was clean while pre-push failed on 11
    # pre-existing sites. This ignore is honoured by 0.9.10 and inert under 0.15.22.
    # DO NOT "clean this up": removing it re-breaks pre-push until the hook rev is
    # bumped to match the constraints.txt pin.
    "UP038",   # non-pep604-isinstance — withdrawn upstream; see note above
    # UP042 would turn every `(str, Enum)` into `StrEnum`. That is not a pure
    # rename: `str()` and `format()` of a member change from "Cls.MEMBER" to the
    # value, and wire strings and messages depend on the current spelling
    # (AGENTS.md naming rules: "use .value"). Move-only floor step, no behaviour change.
    "UP042",   # replace-str-enum: changes str()/format() of members, so (str, Enum) stays
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",
    "B017",  # tests may use assert True/False and assertRaises
]
"examples/*" = ["E501"]
"src/fsm_llm/monitor/*" = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["fsm_llm"]

[tool.mypy]
python_version = "3.11"
# The package is src/fsm_llm/: `mypy -p fsm_llm` finds it through this path.
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
