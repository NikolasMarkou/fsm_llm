[tox]
envlist = py311, py312, py313, py314, py315
isolated_build = True

[testenv]
extras = dev,workflows,reasoning,agents,monitor,eval,synthesis,testing,otel,a2a
install_command = pip install -c {toxinidir}/constraints.txt {opts} {packages}
commands =
    pytest {posargs:tests} --cov=fsm_llm --cov-branch

[testenv:lint]
extras = dev
commands =
    ruff check src tests

[testenv:type]
extras = dev
commands =
    python -m mypy -p fsm_llm
