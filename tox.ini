[tox]
envlist = py310, py311, py312
isolated_build = True

[testenv]
extras = dev,workflows,reasoning,agents,monitor,harness,eval
install_command = pip install -c {toxinidir}/constraints.txt {opts} {packages}
commands =
    pytest {posargs:tests} --cov=fsm_llm

[testenv:lint]
extras = dev
commands =
    ruff check src tests

[testenv:type]
extras = dev
commands =
    mypy src/fsm_llm/ --ignore-missing-imports
