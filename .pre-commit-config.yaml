repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # mkdocs.yml uses `!!python/name:` (pymdownx.superfences), a tag check-yaml cannot construct.
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: push-gate
        name: Run the lean push gate (scripts/gate.sh push)
        entry: scripts/gate.sh push
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
