# The release workflow (roadmap row 0.1, plan d454fd62 step 112): one pushed tag `vX.Y.Z` builds the
# package once, writes an SBOM, publishes to PyPI with PEP 740 attestations and cuts the GitHub
# release. Nothing else starts it: no manual dispatch, no pull request, no branch push.
#
# Policy (pinned by tests/test_fsm_llm_regression/test_release_workflow.py):
#   * PyPI trusted publishing only: no API token, no password, no `twine upload`. The publisher
#     registered on PyPI names owner `NikolasMarkou`, repository `fsm_llm`, workflow `release.yml`
#     and environment `pypi` (the environment holds a required reviewer; the owner approves the
#     deployment after the build and the SBOM have passed). Any rename of this file, of the
#     environment or of the repository breaks the registration.
#   * `id-token: write` is granted to the `publish` job and to no other job; `contents: write` to
#     the `github-release` job and to no other. The token of the workflow is read-only otherwise.
#   * The package is built ONCE (job `build`); `publish`, `sbom` and `github-release` only
#     download what it built, so the bytes on PyPI are the bytes that were checked.
#   * `publish` is a plain job on a GitHub-hosted runner: no container, no reusable workflow (the
#     publish action refuses both, and trusted publishing needs the top-level workflow identity).
#   * Every action is pinned to a commit SHA with its release tag in the trailing comment, resolved
#     with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` (an annotated tag is dereferenced to
#     its commit), 2026-11-14. No event field is written into a script (they go through `env:`).
#
# The environment URL names the distribution `llm-fsm`, the name of the rename of plan step 113;
# until `[project] name` says `llm-fsm` the `publish` job cannot succeed (PyPI would reject the
# name for the trusted publisher). The `build` job derives the expected file names from
# `[project] name`, so it is correct before and after the rename.
#
# Only FINAL releases are published here: a tag whose version is a pre-release (a, b, rc, dev) fails
# the guard of `build`. Owner steps are in CONTRIBUTING.md, "Releasing".
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install -c constraints.txt build twine
      - name: Check the tag against the package version
        id: version
        # The tag must be `v` plus `__version__` exactly, and that version a final PEP 440 release
        # (a pre-release or dev release is refused: this workflow publishes final releases only).
        # The version file is read as text (nothing is imported). The expected file names come from
        # `[project] name` (PEP 427 and PEP 625: runs of `-`, `_` and `.` become one `_`).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import os
          import pathlib
          import re
          import sys
          import tomllib

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"]
          path = pathlib.Path("src/fsm_llm/__version__.py")
          declared = None
          for node in ast.parse(path.read_text(encoding="utf-8")).body:
              if (
                  isinstance(node, ast.Assign)
                  and any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
              ):
                  declared = node.value.value
          if declared is None:
              sys.exit(f"error: no __version__ string assignment in {path}")
          if tag != "v" + declared:
              sys.exit(f"error: tag {tag} does not match {path} (version {declared}): expected v{declared}")
          try:
              parsed = Version(declared)
          except InvalidVersion:
              sys.exit(f"error: version {declared} in {path} is not a PEP 440 version")
          if str(parsed) != declared or parsed.local is not None or parsed.epoch:
              sys.exit(f"error: version {declared} in {path} is not a plain PEP 440 release")
          if parsed.is_prerelease or parsed.is_devrelease:
              sys.exit(f"error: version {declared} is a pre-release: release.yml publishes final releases only")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["name"]
          dist = re.sub(r"[-_.]+", "_", project).lower()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={declared}\n")
              out.write(f"wheel={dist}-{declared}-py3-none-any.whl\n")
              out.write(f"sdist={dist}-{declared}.tar.gz\n")
          PY
      - name: Extract the release notes from the changelog
        # `changelog_check.py extract` exits 1 when the section is missing or empty: a release
        # with no notes is refused here, before anything is built or uploaded.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/changelog_check.py extract "$VERSION" > release-notes.md
          test -s release-notes.md
      - name: Fit the release notes to the GitHub limit
        # A GitHub release body holds at most 125000 characters, and `gh release create` fails
        # beyond it, AFTER the upload to PyPI. A longer section is cut here, at a line end, with a
        # pointer to the full text at the tag; shorter notes pass unchanged.
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pathlib

          limit = 120_000
          path = pathlib.Path("release-notes.md")
          text = path.read_text(encoding="utf-8")
          if len(text) > limit:
              cut = text[:limit].rsplit("\n", 1)[0].rstrip()
              if cut.count("```") % 2:
                  cut += "\n```"
              link = f"https://github.com/{os.environ['REPO']}/blob/{os.environ['TAG']}/CHANGELOG.md"
              text = f"{cut}\n\n---\n\nThese notes are cut at the GitHub release limit. The full section is in [CHANGELOG.md]({link}).\n"
              path.write_text(text, encoding="utf-8")
              print(f"release notes cut to {len(text)} characters")
          PY
      - name: Build the sdist and the wheel
        env:
          # The isolated build environment installs the build backend under the repository pins.
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: python -m build
      - name: Check the distributions
        run: twine check --strict dist/*
      - name: Check the file names against the version and the project name
        env:
          WHEEL: ${{ steps.version.outputs.wheel }}
          SDIST: ${{ steps.version.outputs.sdist }}
        run: |
          set -euo pipefail
          actual=$(find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)
          wanted=$(printf '%s\n' "$SDIST" "$WHEEL" | LC_ALL=C sort)
          if [ "$actual" != "$wanted" ]; then
              echo "error: dist/ holds: $actual" >&2
              echo "error: the version and the project name give: $wanted" >&2
              exit 1
          fi
      - name: Upload the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

  sbom:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Find the wheel
        id: wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
              echo "error: expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
              exit 1
          fi
          echo "path=${wheels[0]}" >> "$GITHUB_OUTPUT"
      - name: Install the wheel with every extra in a fresh environment
        env:
          WHEEL: ${{ steps.wheel.outputs.path }}
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-env"
          "$RUNNER_TEMP/sbom-env/bin/python" -m pip install -c constraints.txt "${WHEEL}[all]"
      - name: Install the SBOM tool
        # In the job's own interpreter, not in the environment that is described.
        run: python -m pip install -c constraints.txt cyclonedx-bom
      - name: Write the SBOM
        run: |
          set -euo pipefail
          cyclonedx-py environment "$RUNNER_TEMP/sbom-env/bin/python" --pyproject pyproject.toml --mc-type library --sv 1.6 --of JSON -o sbom.cdx.json
          python - <<'PY'
          import json

          bom = json.load(open("sbom.cdx.json", encoding="utf-8"))
          assert bom["bomFormat"] == "CycloneDX", bom["bomFormat"]
          assert bom["components"], "the SBOM lists no component"
          print(f"CycloneDX {bom['specVersion']}: {len(bom['components'])} components")
          PY
      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish:
    # PyPI is the one step that cannot be undone, so it runs last, after the build and the SBOM
    # have passed, and only once the owner approves the deployment to the `pypi` environment.
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/llm-fsm
    permissions:
      # The one job that may mint the OIDC token PyPI exchanges for a short-lived upload token.
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  github-release:
    needs: [publish, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The one job that may write to the repository: it creates the release for the pushed tag.
      contents: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Download the SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: sbom
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* sbom/sbom.cdx.json --title "$TAG" --notes-file notes/release-notes.md --verify-tag
